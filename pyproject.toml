[project]
name = "lexbench"
version = "1.0.0"
description = "A model-agnostic evaluation harness for legal-task performance of language models."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Richard Berman" }]
dependencies = [
    "anthropic==2.7.0",
    "httpx==0.28.1",
    "datasets==5.2.0",
    "pyyaml==6.0.3",
    "jsonschema==4.26.0",
]

[project.scripts]
lexbench = "lexbench.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4", "mypy==2.4.1", "types-pyyaml==6.0.12.20261103", "types-jsonschema==4.26.0.20261006"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lexbench", "graders"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["lexbench", "graders", "tests", "tools"]

[[tool.mypy.overrides]]
module = ["datasets", "datasets.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
